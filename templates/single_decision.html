{% extends "base.html" %}

{% block title %}Create Decision | Deci Log{% endblock %}

{% block content %}
<ul>


    <li>title : {{decision.title}}</li>
    <li>Rationale: {{decision.reason}}</li>
    <li>Confidence:{{decision.confidence_level}}</li>
    <li>outcome: {{decision.outcome}}</li>

</ul>
<button>
    <a href="{{url_for('update_decision' ,id=decision.id)}}"> update </a> </button>

<form action="{{url_for('delete_decision' ,id=decision.id)}}" , method="post">

    <button type="submit">Delete</button>
</form>


{% endblock %}
