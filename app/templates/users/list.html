{% extends 'base.html' %}

{% block title %}Users{% endblock %}

{% block content %}
<section class="panel">
    <div class="heading-row">
        <h2>Users</h2>
        <a class="btn" href="{{ url_for('users.create_user') }}">New User</a>
    </div>

    {% if users %}
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Decisions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td><a href="{{ url_for('users.user_detail', user_id=user.id) }}">{{ user.name }}</a></td>
                <td>{{ user.email }}</td>
                <td>{{ user.decisions|length }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No users yet.</p>
    {% endif %}
</section>
{% endblock %}
