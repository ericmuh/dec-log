{% extends 'base.html' %}

{% block title %}Create User{% endblock %}

{% block content %}
<section class="panel form-panel">
    <h2>Create User</h2>
    <form method="post" action="{{ url_for('users.create_user') }}">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Alice">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="alice@example.com">

        <button class="btn" type="submit">Save User</button>
    </form>
</section>
{% endblock %}
