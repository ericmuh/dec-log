<style>
    table,
    th,
    td {
        border: 1px solid black;
        border-collapse: collapse;
    }
</style>

{% extends "base.html" %}

{% block title %}Decisions | Deci Log{% endblock %}

{% block content %}
<table>
    <tr>
        <th>Decision</th>
        <th>Reason</th>
        <th>Confidence</th>
        <th>Outcome</th>
        <th>details</th>

    </tr>

    {%for decision in decisions %} <!-- this is jinja not html -->
    <tr>
        <td>{{decision.title}}</td>
        <td>{{decision.reason}}</td>
        <td>{{decision.confidence_level}}</td>
        <td>{{decision.outcome}}</td>
        <td><a href="{{url_for('decision.single_decision' ,id=decision.id)}}">details</a></td>
    </tr>

    {%endfor%}










</table>
{% endblock %}
